global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s
  external_labels:
    cluster: capstone-lab
    region: local

scrape_configs:
  - job_name: demo
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: checkout
          env: lab
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "go_.*|process_.*"
        action: drop

  - job_name: mini-prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

rule_files:
  - "../rules/capstone.yml"
