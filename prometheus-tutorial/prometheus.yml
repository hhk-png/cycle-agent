global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: mini-local

scrape_configs:
  - job_name: mini-prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: demo
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          env: lab

rule_files:
  - "rules/demo.yml"
