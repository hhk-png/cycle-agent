upstream mlflow_backend {
    server mlflow:5000;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS. Remove this block only for a local trial.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Artifact uploads and trace payloads can be large. Keep this aligned with
    # the limit enforced by the MLflow/gunicorn layer; Nginx should reject
    # early, but the application must still enforce its own bound.
    client_max_body_size 100m;

    # Long-running log streaming and large downloads.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://mlflow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Do not rewrite redirects to the internal service name.
        proxy_redirect off;

        # Streaming responses (UI, artifact downloads) should not be buffered
        # into a temporary file first.
        proxy_buffering off;
    }

    # Health checks should bypass authentication if you add an auth proxy.
    location = /health {
        proxy_pass http://mlflow_backend/health;
        access_log off;
    }
}
