# Reference stack: MLflow + Postgres + MinIO + Nginx.
# This file is intentionally conservative: one server process, one database,
# one object store. Scale the server horizontally only after artifacts and the
# database are external (they are here).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-latest}
    depends_on:
      minio:
        # Do not depend on a MinIO healthcheck: recent minio/minio images
        # removed curl, and mc is not guaranteed in the server image.  The
        # retry loop below is the readiness check that matters.
        condition: service_started
    environment:
      # The entrypoint below expands ${MLFLOW_BUCKET}; without this line a
      # custom bucket in .env would only affect the mlflow service.
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-change-me-minio}'; do
        echo 'waiting for minio'; sleep 2;
      done &&
      mc mb --ignore-existing local/${MLFLOW_BUCKET:-mlflow} &&
      mc anonymous set none local/${MLFLOW_BUCKET:-mlflow}
      "
    restart: "no"

  mlflow:
    build:
      context: .
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-3.18.0}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      AWS_DEFAULT_REGION: us-east-1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}
      --serve-artifacts
      --workers ${MLFLOW_WORKERS:-2}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${MLFLOW_HTTP_PORT:-8080}:80"
      - "${MLFLOW_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
