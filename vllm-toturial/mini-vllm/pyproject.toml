[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "A readable, runnable re-implementation of the vLLM architecture in pure NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.scripts]
minivllm = "minivllm.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.24", "pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["minivllm"]
