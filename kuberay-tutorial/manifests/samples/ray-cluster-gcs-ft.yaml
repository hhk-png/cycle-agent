apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-gcs-ft
spec:
  rayVersion: "2.59.0"
  gcsFaultToleranceOptions:
    backend: redis
    redisAddress: redis.default.svc.cluster.local:6379
    redisPassword:
      valueFrom:
        secretKeyRef:
          name: redis-password
          key: password
    externalStorageNamespace: raycluster-gcs-ft
  autoscalerOptions:
    version: v2
    idleTimeoutSeconds: 60
  enableInTreeAutoscaling: true
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: ray
            image: rayproject/ray:2.59.0
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
  workerGroupSpecs:
    - groupName: workers
      replicas: 1
      minReplicas: 0
      maxReplicas: 10
      rayStartParams: {}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ray
              image: rayproject/ray:2.59.0
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
