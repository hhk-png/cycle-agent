apiVersion: ray.io/v1
kind: RayCronJob
metadata:
  name: raycronjob-sample
spec:
  schedule: "0 2 * * *"
  timeZone: UTC
  suspend: false
  jobTemplate:
    entrypoint: python -c "import ray; ray.init(); print('nightly job')"
    submissionMode: K8sJobMode
    shutdownAfterJobFinishes: true
    ttlSecondsAfterFinished: 600
    backoffLimit: 1
    runtimeEnvYAML: |
      env_vars:
        RUN_MODE: nightly
    rayClusterSpec:
      rayVersion: "2.59.0"
      headGroupSpec:
        rayStartParams: {}
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: ray
                image: rayproject/ray:2.59.0
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
      workerGroupSpecs:
        - groupName: workers
          replicas: 2
          minReplicas: 0
          maxReplicas: 8
          rayStartParams: {}
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: ray
                  image: rayproject/ray:2.59.0
                  resources:
                    requests:
                      cpu: "2"
                      memory: 4Gi
