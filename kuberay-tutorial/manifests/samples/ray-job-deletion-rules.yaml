apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rayjob-deletion-rules
spec:
  entrypoint: python -c "print('cleanup policy demo')"
  submissionMode: K8sJobMode
  # deletionRules and shutdownAfterJobFinishes are mutually exclusive.
  shutdownAfterJobFinishes: false
  deletionStrategy:
    deletionRules:
      # Keep workers for 5 minutes after failure so logs can be inspected,
      # then delete the whole cluster.
      - policy: DeleteWorkers
        condition:
          jobStatus: FAILED
          ttlSeconds: 300
      - policy: DeleteCluster
        condition:
          jobStatus: FAILED
          ttlSeconds: 600
      # Successful jobs are cleaned up immediately.
      - policy: DeleteCluster
        condition:
          jobStatus: SUCCEEDED
          ttlSeconds: 0
      # Remove the RayJob itself one hour after the deployment failed.
      - policy: DeleteSelf
        condition:
          jobDeploymentStatus: Failed
          ttlSeconds: 3600
  rayClusterSpec:
    rayVersion: "2.59.0"
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ray
              image: rayproject/ray:2.59.0
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
    workerGroupSpecs:
      - groupName: workers
        replicas: 1
        minReplicas: 0
        maxReplicas: 4
        rayStartParams: {}
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: ray
                image: rayproject/ray:2.59.0
                resources:
                  requests:
                    cpu: "2"
                    memory: 4Gi
