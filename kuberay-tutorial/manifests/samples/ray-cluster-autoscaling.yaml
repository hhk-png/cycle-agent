apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-autoscaled
spec:
  rayVersion: "2.59.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    version: v2
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: ray
            image: rayproject/ray:2.59.0
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 20
      idleTimeoutSeconds: 60
      priority: 10
      rayStartParams: {}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ray
              image: rayproject/ray:2.59.0
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
    - groupName: gpu-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 4
      idleTimeoutSeconds: 120
      priority: 0
      rayStartParams: {}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ray
              image: rayproject/ray:2.59.0-gpu
              resources:
                requests:
                  cpu: "4"
                  memory: 16Gi
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
