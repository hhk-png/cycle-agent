apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  APP_MODE: production
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: default
type: Opaque
stringData:
  token: "s3cr3t-demo-token"
---
apiVersion: v1
kind: Pod
metadata:
  name: configured-app
  namespace: default
  labels:
    app: configured
spec:
  containers:
    - name: app
      image: demo/config-app:1.0
      env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MODE
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: token
      volumeMounts:
        - name: config
          mountPath: /etc/config
      ports:
        - containerPort: 8080
  volumes:
    - name: config
      configMap:
        name: app-config
