# Extended resources model accelerators as integer, non-overcommittable
# resources.  Each node in this scenario advertises one nvidia.com/gpu.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-trainer-a
  labels:
    app: gpu-trainer
spec:
  containers:
    - name: trainer
      image: demo/trainer:v1
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
---
