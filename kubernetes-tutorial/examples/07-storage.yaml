apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-consumer
  namespace: default
spec:
  containers:
    - name: app
      image: demo/storage-app:1.0
      volumeMounts:
        - name: workspace
          mountPath: /workspace
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: workspace
