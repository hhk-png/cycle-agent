apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  namespace: default
spec:
  replicas: 4
  minReadySeconds: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      containers:
        - name: app
          image: demo:v1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
