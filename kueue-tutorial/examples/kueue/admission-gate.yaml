# Admission gating: a pre-quota external gate.
#
# The annotation is copied from the Job to its Workload. While the gate is
# present the Workload cannot reserve quota. The external controller removes
# its own gate entry after the check passes.
#
# This is different from an AdmissionCheck: gates run before quota reservation,
# AdmissionChecks run after it.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gated-cq
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu"]
    flavors:
    - name: default-flavor
      resources:
      - name: cpu
        nominalQuota: 8
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: default
  name: gated-queue
spec:
  clusterQueue: gated-cq
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gated-job
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: gated-queue
  annotations:
    kueue.x-k8s.io/admission-gated-by: security.example.com/scan,license.example.com/check
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      containers:
      - name: c
        image: busybox
        command: ["sleep", "600"]
        resources:
          requests:
            cpu: "1"
      restartPolicy: Never
