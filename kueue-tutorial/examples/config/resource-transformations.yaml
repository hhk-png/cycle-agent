# Fragment for kueue-system/kueue-manager-config's
# controller_manager_config.yaml. Merge the `resources.transformations` list
# into the existing Configuration; do NOT kubectl apply this as a second CR.
#
# See docs/03-install-and-quickstart.md 3.6.1 for the safe edit/restart flow.
apiVersion: config.kueue.x-k8s.io/v1beta2
kind: Configuration
namespace: kueue-system
resources:
  transformations:
  - input: example.com/gpumem
    strategy: Replace
    multiplyBy: example.com/gpu
    outputs:
      example.com/total-gpumem: "1"
  - input: example.com/gpucores
    strategy: Replace
    multiplyBy: example.com/gpu
    outputs:
      example.com/total-gpucores: "1"
  # Replace with empty outputs excludes the vGPU count from quota.
  - input: example.com/gpu
    strategy: Replace
    outputs: {}
