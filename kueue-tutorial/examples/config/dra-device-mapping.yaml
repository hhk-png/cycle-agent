# Fragment for kueue-system/kueue-manager-config's
# controller_manager_config.yaml. Merge `resources.deviceClassMappings` into
# the existing Configuration; do NOT kubectl apply this as a second CR.
#
# The logical name (nvidia.com/gpu) is what ClusterQueue.nominalQuota and
# Workload.status.admission use; the DeviceClass itself is not a quota unit.
apiVersion: config.kueue.x-k8s.io/v1beta2
kind: Configuration
namespace: kueue-system
resources:
  deviceClassMappings:
  - name: nvidia.com/gpu
    deviceClassNames:
    - gpu.example.com
