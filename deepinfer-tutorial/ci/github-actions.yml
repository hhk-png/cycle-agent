# Example GitHub Actions workflow.
#
# Copy this file to .github/workflows/ci.yml in the repository that contains
# the tutorial.  It is kept outside .github/ here so that the tutorial can be
# vendored into another repository without silently registering a workflow.

name: tutorial-ci

on:
  push:
    paths:
      - "deepinfer-tutorial/**"
  pull_request:
    paths:
      - "deepinfer-tutorial/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: deepinfer-tutorial

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Run every example
        run: |
          for f in examples/*.py; do
            case "$f" in
              */_common.py) continue ;;
            esac
            echo "== $f"
            python "$f"
          done

      - name: Documentation consistency
        run: python check_docs.py

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: deepinfer-tutorial/dist/*.whl
