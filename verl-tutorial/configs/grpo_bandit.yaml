data:
  dataset: bandit
  train_size: 64
  val_size: 32
  train_batch_size: 16
  max_prompt_length: 4
  max_response_length: 1

actor_rollout_ref:
  model:
    arch: linear
    hidden_size: 32
    max_seq_len: 32
  actor:
    ppo_mini_batch_size: 64
    ppo_micro_batch_size: 64
    optim:
      lr: 0.01
  rollout:
    n: 8
    temperature: 1.0
    allowed_chars: xyzw

algorithm:
  adv_estimator: grpo

reward:
  reward_fn: bandit

trainer:
  total_training_steps: 40
  val_before_train: false
  logger: [console]
  n_gpus_per_node: 1
  nnodes: 1
