data:
  dataset: bandit
  train_size: 64
  val_size: 32
  train_batch_size: 8
  max_prompt_length: 4
  max_response_length: 1

actor_rollout_ref:
  model:
    arch: linear
    hidden_size: 32
    max_seq_len: 32
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size: 16
    optim:
      lr: 0.01
  rollout:
    n: 2
    temperature: 1.0
    allowed_chars: xyzw

critic:
  enable: true
  model:
    arch: linear
    hidden_size: 32
  ppo_mini_batch_size: 16
  ppo_micro_batch_size: 16

algorithm:
  adv_estimator: gae
  gamma: 1.0
  lam: 0.95

reward:
  reward_fn: bandit

trainer:
  total_training_steps: 20
  val_before_train: false
  logger: [console]
  n_gpus_per_node: 1
  nnodes: 1
