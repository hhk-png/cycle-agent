# Cron VolcanoJob（v1.13+）。jobTemplate.spec 是完整的 Volcano JobSpec，
# 不是 Kubernetes Job 的 template。
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: default
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      schedulerName: volcano
      queue: team-b
      minAvailable: 1
      maxRetry: 2
      tasks:
        - name: eval
          replicas: 1
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: eval
                  image: busybox:1.36
                  command: ["sh", "-c", "date; echo nightly evaluation"]
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
